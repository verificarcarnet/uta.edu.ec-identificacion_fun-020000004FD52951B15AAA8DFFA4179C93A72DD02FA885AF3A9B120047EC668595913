            color: #000;

            text-align: left;
            font-weight: bold;
            padding: 15px 12px 10px 12px;
        }

        .logo-uta {
            width: 150px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }

        .label-col {
            width: 25%;
            font-weight: normal;
            background-color: #ffffff;
        }

        .value-col {
            width: 75%;
            background-color: #ffffff;
        }

        .user-photo {
            height: 100px;
            width: auto;
            display: block;
        }
